{% extends 'base.html' %}

{% block title %}Question Answering - ML Projects{% endblock %}

{% block content %}
<div class="jumbotron">
    <h1 class="display-4">Question Answering</h1>
    <p class="lead">Ask a question based on a given context</p>
    <hr class="my-4">
    <form method="post">
        <div class="form-group">
            <label for="context">Context:</label>
            <textarea class="form-control" id="context" name="context" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <label for="question">Question:</label>
            <input type="text" class="form-control" id="question" name="question" required>
        </div>
        <button type="submit" class="btn btn-primary">Get Answer</button>
    </form>
    {% if answer %}
    <div class="mt-4">
        <h4>Answer:</h4>
        <p>{{ answer }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
