{% extends 'base.html' %}

{% block title %}Speech Transcription {% endblock %}

{% block content %}
<div class="container">
    <h2>Speech Transcription </h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="audio">Upload Audio File:</label>
            <input type="file" class="form-control-file" id="audio" name="audio" accept="audio/*" required>
        </div>
        <button type="submit" class="btn btn-primary">Upload and Transcribe</button>
    </form>
    {% if text %}
    <h3>Transcribed Text:</h3>
    <p>{{ text }}</p>
    {% endif %}
</div>
{% endblock %}
