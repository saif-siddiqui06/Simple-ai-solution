<!-- templates/base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ML Projects Website{% endblock %}</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .navbar-nav .nav-link {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .navbar-brand :first-child{
            color: #fad014;
        }

        .navbar-light .navbar-brand {
            color: #f7df2a;
            background-image: -webkit-linear-gradient(45deg, #f7df2a 7%, #0b0582 27%, #ffaf38 46%);
            background-clip: text;
            -webkit-background-clip: text;
            text-fill-color: transparent;
            -webkit-text-fill-color: transparent;
            font-family: math;            
        }

        .navbar-nav .nav-link {
            font-size: 1rem;
            font-weight: bold;
            font-family: math;
            text-align: center;
        }

        .navbar-light .navbar-nav .nav-link {
            color: black;
        }

        body {
            background-color: #ffd700;
        }

        .bg-light {
            background-color: #dae0e5 !important;
        }

        .card {
            position: relative;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            min-width: 0;
            word-wrap: break-word;
            background-color: #fff;
            background-clip: border-box;
            border: 1px solid rgba(33, 150, 243, 0.1);
            border-radius: 10px;
            box-shadow: 0 15px 45px rgba(33, 150, 243, 0.1);
        }

        .jumbotron {
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            background-color: #dae0e5 !important;
            border-radius: .3rem;
            border-radius: 6px;
            box-shadow: 0 15px 45px rgba(33, 150, 243, 0.1);
            text-align: center;
            font-family: math;
        }

        .display-4 {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.2;
            color: #f7df2a;
            background-image: -webkit-linear-gradient(45deg, #f7df2a 7%, #0b0582 27%, #ffaf38 46%);
            background-clip: text;
            -webkit-background-clip: text;
            text-fill-color: transparent;
            -webkit-text-fill-color: transparent;
            font-family: math;
        }

        h1 {
            font-family: math;
        }

        .btn-primary {
            color: #fff;
            background-color: #4b9aef;
            border-color: #3e8bdd;
            font-family: math;
        }

        .site-footer
{
    .site-footer {
        /* background-color: #26272b; */
        padding: 45px 0 20px;
        font-size: 15px;
        line-height: 24px;
        color: black;
        font-family: math;
    }
}
.site-footer hr
{
  border-top-color:#bbb;
  opacity:0.5
}
.site-footer hr.small
{
  margin:20px 0
}
.site-footer h6
{
  color:#fff;
  font-size:16px;
  text-transform:uppercase;
  margin-top:5px;
  letter-spacing:2px
}
.site-footer a
{
  color:#737373;
}
.site-footer a:hover
{
  color:#3366cc;
  text-decoration:none;
}
.footer-links
{
  padding-left:0;
  list-style:none
}
.footer-links li
{
  display:block
}
.footer-links a
{
  color:#737373
}
.footer-links a:active,.footer-links a:focus,.footer-links a:hover
{
  color:#3366cc;
  text-decoration:none;
}
.footer-links.inline li
{
  display:inline-block
}
.site-footer .social-icons
{
  text-align:right
}
.site-footer .social-icons a
{
  width:40px;
  height:40px;
  line-height:40px;
  margin-left:6px;
  margin-right:0;
  border-radius:100%;
  background-color:#33353d
}
.copyright-text
{
  margin:0
}
@media (max-width:991px)
{
  .site-footer [class^=col-]
  {
    margin-bottom:30px
  }
}
@media (max-width:767px)
{
  .site-footer
  {
    padding-bottom:0
  }
  .site-footer .copyright-text,.site-footer .social-icons
  {
    text-align:center
  }
}
.social-icons
{
  padding-left:0;
  margin-bottom:0;
  list-style:none
}
.social-icons li
{
  display:inline-block;
  margin-bottom:4px
}
.social-icons li.title
{
  margin-right:15px;
  text-transform:uppercase;
  color:#96a2b2;
  font-weight:700;
  font-size:13px
}
.social-icons a{
  background-color:#eceeef;
  color:#818a91;
  font-size:16px;
  display:inline-block;
  line-height:44px;
  width:44px;
  height:44px;
  text-align:center;
  margin-right:8px;
  border-radius:100%;
  -webkit-transition:all .2s linear;
  -o-transition:all .2s linear;
  transition:all .2s linear
}
.social-icons a:active,.social-icons a:focus,.social-icons a:hover
{
  color:#fff;
  background-color:#29aafe
}
.social-icons.size-sm a
{
  line-height:34px;
  height:34px;
  width:34px;
  font-size:14px
}
.social-icons a.facebook:hover
{
  background-color:#3b5998
}
.social-icons a.twitter:hover
{
  background-color:#00aced
}
.social-icons a.linkedin:hover
{
  background-color:#007bb6
}
.social-icons a.dribbble:hover
{
  background-color:#ea4c89
}
@media (max-width:767px)
{
  .social-icons li.title
  {
    display:block;
    margin-right:0;
    font-weight:600
  }
}

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <i class="fas fa-brain mr-2"></i>  AI & ML World 
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('sentiment_analysis') }}">
                        <i style="color:#ffde34;" class="fas fa-smile-wink mr-1"></i> Sentiment Analysis
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('ner') }}">
                        <i style="color:blue;" class="fas fa-user mr-1"></i> NER
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('text_summarization') }}">
                        <i style="color: blackwhite;" class="fas fa-file-alt mr-1"></i> Text Summarization
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('topic_modeling') }}">
                        <i style="color:blue;" class="fas fa-cube mr-1"></i> Topic Modeling
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('text_translation') }}">
                        <i style="color:blue;" class="fas fa-language mr-1"></i> Text Translation
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('speech_recognition') }}">
                        <i style="color:blue;" class="fas fa-microphone mr-1"></i> Speech Recognition
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('qa') }}">
                        <i style="color:red;" class="fas fa-question-circle mr-1"></i> Question Answering
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
